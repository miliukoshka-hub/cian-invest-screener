<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{width:330px;margin:0;padding:16px;background:#0f172a;color:#f8fafc;font:14px/1.45 "Segoe UI",Arial,sans-serif}
    h1{font-size:16px;margin:0 0 8px;color:#7dd3fc}p{color:#cbd5e1;margin:8px 0}
    button{width:100%;border:0;border-radius:8px;background:#0284c7;color:white;font-weight:700;padding:11px;margin-top:10px;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}.note{font-size:12px;color:#94a3b8}.status{font-size:12px;margin-top:10px;white-space:pre-wrap}
  </style>
</head>
<body>
  <h1>ЦИАН → Инвест-скринер</h1>
  <p>Передать в форму карточки, которые сейчас видны на открытой странице результатов ЦИАН.</p>
  <p class="note">Расширение не обходит CAPTCHA и не листает страницы. Если ЦИАН попросит проверку, пройдите её вручную. Для следующей страницы нажмите кнопку ещё раз.</p>
  <button id="collect">Собрать текущую страницу</button>
  <div class="status" id="status">Откройте выдачу ЦИАН в этой вкладке.</div>
  <script src="popup.js"></script>
</body>
</html>
